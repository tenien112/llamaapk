name: Compilar APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compilar
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle :app:bundleRelease --no-daemon
      - name: Renombrar
        run: cp app/build/outputs/bundle/release/app-release.aab LLAMA-LORENZITO.aab
      - name: Publicar versión
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: LLAMA-LORENZITO 1.${{ github.run_number }}
          make_latest: true
          files: LLAMA-LORENZITO.aab
